<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06231f">
<title>Scheme Hub 2026 · Town login</title>
<style>
:root{--ink:#e9f6f3;--mute:#8fb8b1;--acc:#2dd4bf;--acc2:#0e8a7d;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
background:radial-gradient(120% 80% at 80% 0%,#12594f 0%,transparent 55%),radial-gradient(90% 70% at 0% 100%,#0b3b44 0%,transparent 60%),#06231f;
min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));overflow-x:hidden;position:relative}
.mtn{position:fixed;left:0;right:0;bottom:0;width:100%;height:42vh;min-height:220px;z-index:0;pointer-events:none}
.stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
main{position:relative;z-index:1;width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:22px}
.logo{width:58px;height:58px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;
background:linear-gradient(145deg,var(--acc),var(--acc2));box-shadow:0 10px 30px rgba(45,212,191,.35)}
h1{font-size:25px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.card{background:rgba(10,38,34,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.f{position:relative;margin-bottom:14px}
.f input{width:100%;height:56px;padding:22px 46px 6px 16px;border-radius:14px;border:1px solid var(--line);
background:rgba(255,255,255,.06);color:var(--ink);font-size:16px;outline:0;transition:.2s}
.f input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(45,212,191,.16)}
.f label{position:absolute;left:16px;top:17px;color:var(--mute);font-size:15px;pointer-events:none;transition:.18s;transform-origin:left}
.f input:focus+label,.f input:not(:placeholder-shown)+label{transform:translateY(-10px) scale(.78);color:var(--acc)}
.eye{position:absolute;right:6px;top:8px;width:40px;height:40px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:10px}
button.go{width:100%;height:54px;margin-top:6px;border:0;border-radius:14px;font-size:17px;font-weight:600;color:#04201c;cursor:pointer;
background:linear-gradient(135deg,#5eead4,var(--acc));box-shadow:0 10px 26px rgba(45,212,191,.32);transition:.15s}
button.go:active{transform:scale(.98)}button.go[disabled]{opacity:.7}
.err{min-height:20px;margin:10px 2px 0;color:#ffb4a8;font-size:14px;text-align:center}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.rem{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;margin:2px 2px 10px}
.rem input{accent-color:var(--acc);width:17px;height:17px}
.hide{display:none!important}
.hello{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.town{font-size:28px;font-weight:700;margin:2px 0 2px;letter-spacing:-.02em}
.role{color:var(--mute);font-size:14px;margin-bottom:18px}
a.tile{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-top:10px;border-radius:16px;text-decoration:none;color:var(--ink);
background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.15s}
a.tile:active{transform:scale(.98)}a.tile b{display:block;font-size:16px}a.tile small{color:var(--mute);font-size:13px}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(45,212,191,.14);color:var(--acc);flex:none}
.out{width:100%;margin-top:16px;background:none;border:0;color:var(--mute);font-size:14px;cursor:pointer;padding:10px}
.foot{position:relative;z-index:1;margin-top:20px;color:var(--mute);font-size:12px;text-align:center;opacity:.8}
</style></head><body>
<div class="stars" aria-hidden="true"></div>
<svg class="mtn" viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true">
<path d="M0 300V170l90-70 70 55 110-110 90 95 80-60 120 120 70-50 170 90v60z" fill="#0b3a36" opacity=".55"/>
<path d="M0 300V215l110-60 80 50 120-85 100 80 90-45 130 90 80-40 90 55v40z" fill="#082b29" opacity=".85"/>
<path d="M0 300v-55l130-40 100 45 120-55 120 60 110-40 220 50v35z" fill="#051c1b"/></svg>
<main>
<div class="brand"><div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#04201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"/><circle cx="17" cy="6" r="1.6"/></svg></div>
<h1>Scheme Hub 2026</h1><div class="sub">Property survey &amp; collection · Himachal Pradesh</div></div>

<form class="card" id="login" autocomplete="on">
<div class="f"><input id="u" placeholder=" " autocapitalize="characters" autocomplete="username" spellcheck="false" required><label for="u">Town ID (e.g. BHOTA_ADMIN)</label></div>
<div class="f"><input id="p" type="password" placeholder=" " autocomplete="current-password" required><label for="p">Password</label>
<button type="button" class="eye" id="eye" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<label class="rem"><input type="checkbox" id="rm" checked> Remember my Town ID on this device</label>
<button class="go" id="go" type="submit">Sign in</button>
<div class="err" id="m" role="alert"></div>
</form>

<section class="card hide" id="home">
<div class="hello" id="hi">Welcome</div><div class="town" id="t"></div><div class="role" id="r"></div>
<a class="tile" id="app" href="app/"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg></span><span><b>Survey &amp; collection</b><small>Open the main app</small></span></a>
<a class="tile hide" id="adm" href="app/admin_users.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg></span><span><b>Manage IDs &amp; users</b><small>Supervisors, collectors, approver, cashier</small></span></a>
<button class="out" id="out">Sign out</button>
</section>
<div class="foot">An independent field-operations suite · © Scheme Hub 2026</div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBJw_9j0wP1dY42wfYYDk_3kIMNKZqHujQ",authDomain:"propertytax-1b855.firebaseapp.com",databaseURL:"https://propertytax-1b855-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"propertytax-1b855",appId:"1:1062167049262:web:1270c8199c81addce11bbf"});
const APP_URL="app/"; /* where the survey & collection app lives */
const auth=getAuth(app),db=getDatabase(app),$=i=>document.getElementById(i);
const email=v=>{v=v.trim().toLowerCase();return v.includes("@")?v:v+"@propertytax.app"};
const LABEL={admin:"ULB admin",supervisor:"Supervisor / approver",surveyor:"Data collector",assessor:"Assessor",cashier:"Cashier",monitor:"Monitor"};
const st=document.querySelector(".stars");for(let i=0;i<28;i++){const s=document.createElement("i");s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*45}%;animation-delay:${Math.random()*3}s`;st.append(s)}
try{const s=localStorage.getItem("hub_town_id");if(s)$("u").value=s}catch(e){}
$("eye").onclick=()=>{const p=$("p");p.type=p.type==="password"?"text":"password"};
let manual=false;
const fail=t=>{$("m").textContent=t;const c=$("login");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")};
$("login").onsubmit=async e=>{e.preventDefault();$("m").textContent="";$("go").disabled=true;$("go").textContent="Signing in…";manual=true;
  try{await signInWithEmailAndPassword(auth,email($("u").value),$("p").value);
    try{$("rm").checked?localStorage.setItem("hub_town_id",$("u").value.trim()):localStorage.removeItem("hub_town_id")}catch(x){}}
  catch(x){fail(x.code==="auth/too-many-requests"?"Too many attempts. Please wait a few minutes.":x.code==="auth/network-request-failed"?"No internet connection.":"Wrong Town ID or password.")}
  $("go").disabled=false;$("go").textContent="Sign in"};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $("login").classList.toggle("hide",!!u);$("home").classList.toggle("hide",!u);
  if(!u){$("p").value="";return}
  try{
    const me=(await get(ref(db,"users/"+u.uid))).val();
    if(!me||me.role==="disabled"||!me.ulb){await signOut(auth);fail("This login has no access. Contact your admin.");return}
    let name="All towns";
    if(me.ulb!=="*"){const x=(await get(ref(db,"ulbs/"+me.ulb))).val();
      if(x&&x.active===false){await signOut(auth);fail("This town is switched off.");return}
      name=(x&&x.name)||me.ulb.replace(/_/g," ")}
    $("hi").textContent=manual?"Welcome":"Welcome back";
    $("t").textContent=name;$("r").textContent=(me.name?me.name+" · ":"")+(LABEL[me.role]||me.role);
    $("app").href=APP_URL;$("adm").classList.toggle("hide",me.role!=="admin");
  }catch(e){await signOut(auth);fail("Could not load your town. Try again.")}
});
</script></body></html>
