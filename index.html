<style id="schemehub-unified-light-theme">
/* Scheme Hub 2026 — unified accessible light theme */
:root{color-scheme:light;--bg:#f4f7fb;--bg-elev:#ffffff;--surface:#ffffff;--surface-solid:#ffffff;--surface2:#f7f9fc;--line:#e2e8f0;--line-strong:#cbd5e1;--text:#1e293b;--muted:#64748b;--faint:#94a3b8;--gold:#a66b16;--gold-soft:#80510e;--gold-dim:#fff4d9;--accent:#2563eb;--accent-glow:rgba(37,99,235,.12);--shadow:0 3px 14px rgba(15,23,42,.06);--shadow-lg:0 14px 36px rgba(15,23,42,.10)}
html{color-scheme:light;background:#f4f7fb}body{background:#f4f7fb!important;background-image:linear-gradient(180deg,#f8fafc 0%,#eef3f9 100%)!important;color:#1e293b!important}
/* Neutralise common dark utility palettes without changing layout or behaviour */
.bg-black,.bg-gray-950,.bg-gray-900,.bg-slate-950,.bg-slate-900,.bg-zinc-950,.bg-zinc-900{background-color:#fff!important}
.bg-gray-800,.bg-slate-800,.bg-zinc-800{background-color:#f8fafc!important}
.text-white,.text-gray-100,.text-gray-200,.text-slate-100,.text-slate-200,.text-zinc-100,.text-zinc-200{color:#1e293b!important}
.text-gray-300,.text-gray-400,.text-slate-300,.text-slate-400,.text-zinc-300,.text-zinc-400{color:#64748b!important}
.border-gray-700,.border-gray-800,.border-slate-700,.border-slate-800,.border-zinc-700,.border-zinc-800{border-color:#e2e8f0!important}
input,select,textarea{background-color:#fff;color:#1e293b;border-color:#cbd5e1}input::placeholder,textarea::placeholder{color:#94a3b8}
button{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
.card,.glass,.panel,.surface,.modal,.dropdown-menu{box-shadow:0 4px 18px rgba(15,23,42,.06)}
::selection{background:#dbeafe;color:#1e3a8a}::-webkit-scrollbar-thumb{background:#cbd5e1}::-webkit-scrollbar-thumb:hover{background:#94a3b8}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{body{background:#fff!important;color:#111!important;background-image:none!important}}

</style>
</head>
<body class="bg-[#05080f] text-[#eef2fb]">

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
