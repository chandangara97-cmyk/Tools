<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFS Baddi – Block Description Entry</title>
<style>
:root{--bg:#eef2f4;--ink:#14232b;--mute:#5d6f78;--line:#cfd9de;--card:#fff;--accent:#0b5f73;--accent2:#08475a;--ok:#1d7a46;--warn:#b3261e;--n:#0b5f73;--e:#8a5a00;--s:#2f6b2f;--w:#7a2e6b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--accent2);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:19px;margin:0;flex:1 1 260px;font-weight:600}
header h1 small{display:block;font-weight:400;opacity:.8;font-size:13px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent2)}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
header button.primary{background:#f0b429;border-color:#f0b429;color:#2b1d00}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar input{flex:1 1 200px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
#fileStatus{font-size:14px;padding:8px 12px;border-radius:8px;background:#fff3cd;color:#664d03;margin-bottom:12px}
#fileStatus.ok{background:#d9f2e3;color:#14532d}
.rec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.rec-h{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 14px;background:#f6f9fa;border-bottom:1px solid var(--line)}
.rec-h b{font-size:17px}.rec-h span{color:var(--mute)}
.rec-h .acts{margin-left:auto;display:flex;gap:6px}
.rec-h .acts button{padding:5px 10px;font-size:14px}
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dir{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.dir h4{margin:0 0 4px;font-size:14px}
.dir.N h4{color:var(--n)}.dir.E h4{color:var(--e)}.dir.S h4{color:var(--s)}.dir.W h4{color:var(--w)}
.empty{text-align:center;color:var(--mute);padding:50px 10px;background:#fff;border:1px dashed var(--line);border-radius:10px}
/* fullscreen pop-up */
#pop{position:fixed;inset:0;background:var(--accent2);z-index:50;display:none;flex-direction:column;color:#fff}
#pop.show{display:flex}
.pop-top{padding:14px 18px;display:flex;align-items:center;gap:12px}
.pop-top .step{flex:1;font-size:14px;opacity:.85}
.pop-top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.prog{height:5px;background:rgba(255,255,255,.2)}.prog i{display:block;height:100%;background:#f0b429;width:0;transition:width .25s}
.pop-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:820px;width:100%;margin:0 auto;padding:18px}
.ctx{font-size:15px;opacity:.85;margin-bottom:8px;min-height:20px}
.pop-body h2{font-size:clamp(26px,5vw,40px);margin:0 0 6px;font-weight:600}
.pop-body p.hint{margin:0 0 18px;opacity:.8}
.pop-body input,.pop-body textarea{width:100%;font:inherit;font-size:clamp(20px,4vw,28px);padding:14px 16px;border-radius:10px;border:3px solid transparent;background:#fff;color:var(--ink)}
.pop-body textarea{min-height:34vh;resize:vertical;font-size:clamp(17px,3vw,22px);line-height:1.4}
.mic{margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--accent2);border:0;font-weight:700;padding:11px 18px;font-size:17px}
.mic.on{background:#e5383b;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,56,59,.3)}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.micnote{font-size:14px;opacity:.85;margin-left:10px}
.err{color:#ffd0cc;min-height:22px;margin-top:8px;font-weight:600}
.pop-foot{padding:14px 18px;display:flex;gap:10px;justify-content:space-between;max-width:820px;width:100%;margin:0 auto}
.pop-foot button{padding:13px 24px;font-size:17px}
.pop-foot .next{background:#f0b429;border-color:#f0b429;color:#2b1d00;font-weight:700;margin-left:auto}
.pop-foot .back{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.review{background:#fff;color:var(--ink);border-radius:10px;padding:6px 14px;max-height:52vh;overflow:auto}
.review div{padding:8px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}.review div:last-child{border:0}
.review b{display:inline-block;min-width:90px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14232b;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}

.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;
	}

/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}

#map{height:44vh;min-height:250px;border-radius:10px;border:3px solid #fff;background:#cfd9de}
.pop-body{overflow:auto}
.mbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mbar button{padding:8px 12px;font-size:15px}.mbar span{font-size:15px;font-weight:600}
.vtx{background:#f0b429;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #14232b}
.blk{background:rgba(255,255,255,.85);border:1px solid #5d6f78;color:#14232b;font-size:12px;padding:1px 5px}
.bar label{font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}
.bar input#gap{flex:0 0 70px;padding:8px}
#fbp{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
#fbp.show{display:flex}.fbbox{background:#fff;border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.fbbox h3{margin:0 0 6px}.fbbox p{margin:0 0 10px;color:var(--mute);font-size:14px}
.fbbox textarea,.fbbox input{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.fbbox textarea{min-height:150px;font-family:monospace;font-size:13px}.fbact{display:flex;gap:8px;flex-wrap:wrap}#fbMsg{margin-top:10px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>UFS Survey<small>Block description entry (North · East · South · West)</small></h1>
  <button id="btnFile">📁 Data file link karo</button>
  <button id="btnCsv">⬇ CSV</button>
  <button id="btnJson">⬇ JSON</button>
  <button id="btnKml">⬇ KML (all)</button>
  <button id="btnFb">☁ Firebase</button>
  <button id="btnImport">⬆ Import (JSON/CSV)</button>
  <button class="primary" id="btnNew">+ New block entry</button>
  <input type="file" id="importInput" accept=".json,.csv,application/json,text/csv" hidden>
</header>
<main>
  <div id="fileStatus"></div>
  <div class="bar"><input id="search" placeholder="Search IV / Ward / Block / description…"><label>Gap between blocks (m) <input id="gap" type="number" min="0" step="0.5" value="2"></label><span id="count"></span></div>
  <div id="list"></div>
</main>

<div id="pop" role="dialog" aria-modal="true">
  <div class="pop-top"><div class="step" id="stepTxt"></div><button id="btnCancel">✕ Cancel</button></div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="pop-body">
    <div class="ctx" id="ctx"></div>
    <h2 id="qTitle"></h2>
    <p class="hint" id="qHint"></p>
    <div id="qField"></div>
    <div id="micWrap"></div>
    <div class="err" id="err"></div>
  </div>
  <div class="pop-foot"><button class="back" id="btnBack">← Back</button><button class="next" id="btnNext">Next →</button></div>
</div>
<div id="fbp"><div class="fbbox"><h3>☁ Firebase sync</h3>
<p>Firebase console → Project settings → Your apps → Web app ka <b>firebaseConfig</b> yahan paste karo (Realtime Database ka databaseURL zaroori). Config sirf is browser me save hota hai.</p>
<textarea id="fbCfg" placeholder="const firebaseConfig = { apiKey: ..., databaseURL: ..., projectId: ... };"></textarea>
<input id="fbEmail" type="email" placeholder="Login email (agar rules me auth chahiye)"><input id="fbPass" type="password" placeholder="Password (save nahi hota)">
<div class="fbact"><button class="primary" id="fbGo">Connect</button><button id="fbOffBtn">Disconnect</button><button id="fbX">Close</button></div><div id="fbMsg"></div></div></div>
<div id="toast"></div>

</script>
<script>
const STORE_KEY='ufs_baddi_blocks_v1';
const STEPS=[
 {k:'town',label:'Town',hint:'Town ka naam (e.g. Baddi).',type:'input'},
 {k:'iv',label:'IV Number',hint:'Investigator / IV number for this block.',type:'input'},
 {k:'ward',label:'Ward Number',hint:'Ward number of Baddi town.',type:'input'},
 {k:'block',label:'Block Number',hint:'Block number within the ward.',type:'input'},
 {k:'north',label:'North Description',hint:'North boundary of the block. Enter = next, Shift+Enter = new line.',type:'area'},
 {k:'east',label:'East Description',hint:'East boundary of the block.',type:'area'},
 {k:'south',label:'South Description',hint:'South boundary of the block.',type:'area'},
 {k:'west',label:'West Description',hint:'West boundary of the block.',type:'area'},
 {k:'_map',label:'Block boundary (map)',hint:'Map par block ke corners par tap karo (min 3 points). Point drag karke adjust karo; point hatane ke liye long-press / right-click. Skip karna ho to bina point ke Next.',type:'map'},
 {k:'_review',label:'Check & save',hint:'Sab theek hai to Save dabao.',type:'review'}
];
let records=[],cur={},step=0,editId=null,fileHandle=null;

/* ---------- storage ---------- */
function loadLocal(){try{records=JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){records=[]}}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(records))}catch(e){}}
function payload(){return JSON.stringify({survey:'UFS Baddi',saved_at:new Date().toISOString(),records},null,2)}
async function persist(){
  saveLocal();fbPush();
  if(fileHandle){
    try{const w=await fileHandle.createWritable();await w.write(payload());await w.close();setStatus(true,'Saved to file: '+fileHandle.name+' ('+records.length+' blocks)');return true}
    catch(e){setStatus(false,'File write fail ho gaya – dubara "Data file link karo" dabao. Data browser me safe hai.');fileHandle=null}
  }
  return false;
}
function setStatus(ok,msg){const s=document.getElementById('fileStatus');s.className=ok?'ok':'';s.textContent=msg}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ufs_baddi',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=rej})}
async function idbSet(v){try{const d=await idbOpen();d.transaction('h','readwrite').objectStore('h').put(v,'handle')}catch(e){}}
async function idbGet(){try{const d=await idbOpen();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get('handle');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

async function linkFile(){
  if(!window.showSaveFilePicker){alert('Ye browser direct file save support nahi karta. Chrome/Edge use karo. Tab tak "⬇ JSON" se backup le sakte ho.');return}
  const useExisting=records.length===0 && confirm('Pehle se bani hui data file kholni hai?\n\nOK = existing file kholo\nCancel = nayi file banao');
  try{
    let h;
    if(useExisting){

/* ---------- voice to text (English) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,micOn=false,baseText='',finalText='';
const NUM={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function wordsToDigits(t){
  const w=t.toLowerCase().replace(/[.,]/g,'').split(/\s+/),out=[];
  for(let i=0;i<w.length;i++){
    const a=w[i],b=w[i+1];
    if(a in NUM){
      if(NUM[a]>=20&&NUM[a]%10===0&&b in NUM&&NUM[b]>0&&NUM[b]<10){out.push(String(NUM[a]+NUM[b]));i++}
      else out.push(String(NUM[a]));
    }else out.push(w[i]);
  }
  // join consecutive single digits spoken one by one ("one two three" -> 123)
  return out.join(' ').replace(/\b(\d)(?: (?=\d\b))/g,'$1').replace(/\s*-\s*/g,'-');
}
function setupMic(s){
  const w=document.getElementById('micWrap');
  if(!SR){w.innerHTML='<span class="micnote">Voice input is not supported in this browser – use Chrome or Edge.</span>';return}
  w.innerHTML='<button class="mic" id="micBtn" type="button">🎤 Start speaking</button><span class="micnote">English · say "new line" or "full stop" if needed</span>';
  document.getElementById('micBtn').onclick=()=>micOn?stopMic():startMic(s);
}
function startMic(s){
  const el=document.getElementById('fld');if(!el||!SR)return;
  rec=new SR();rec.lang='en-IN';rec.interimResults=true;rec.continuous=s.type==='area';rec.maxAlternatives=1;
  baseText=el.value.trim();finalText='';
  const isNum=s.type==='input';
  rec.onresult=ev=>{
    const segs=[];
    for(let i=0;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript.trim();if(!t)continue;
      const l=segs[segs.length-1];
      if(l&&t.toLowerCase().startsWith(l.toLowerCase()))segs[segs.length-1]=t;else segs.push(t);
    }
    let spoken=segs.join(' ').trim();
    if(isNum)spoken=wordsToDigits(spoken);
    else spoken=spoken.replace(/\s*\bnew line\b\s*/gi,'\n').replace(/\s*\bfull stop\b/gi,'.').replace(/\s*\bcomma\b/gi,',');
    const sep=baseText&&spoken&&!/\n$/.test(baseText)?(isNum?'':' '):'';
    el.value=isNum?spoken:(baseText+sep+spoken);
  };
  rec.onerror=ev=>{document.getElementById('err').textContent=ev.error==='not-allowed'?'Microphone permission blocked – allow mic in browser settings.':ev.error==='no-speech'?'Kuch sunai nahi diya – dubara bolo.':'Voice error: '+ev.error;stopMic(true)};
  rec.onend=()=>{if(micOn&&s.type==='area'){try{baseText=el.value.trim();finalText='';rec.start();return}catch(e){}}stopMic(true)};
  try{rec.start();micOn=true;const b=document.getElementById('micBtn');if(b){b.classList.add('on');b.textContent='⏹ Listening… tap to stop'}}catch(e){}
}
function stopMic(fromEnd){
  const was=micOn;micOn=false;
  if(rec){try{rec.onend=null;rec.stop()}catch(e){}rec=null}
  const b=document.getElementById('micBtn');if(b){b.classList.remove('on');b.textContent='🎤 Start speaking'}
}

/* ---------- map boundary + KML ---------- */
let map=null,pts=[],vm=[],shape=null,isSat=false;
const BASE={osm:()=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
 sat:()=>L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'})};
const gapM=()=>Math.max(0,+document.getElementById('gap').value||0);
const BND=()=>'<div><b>Boundary:</b> '+(cur.poly?Math.round(TURF.area(TURF.polygon(cur.poly))).toLocaleString()+' m² ✔':'not drawn')+'</div>';
function killMap(){if(map){map.remove();map=null}}
function keepPts(){cur.poly=pts.length>=3?cur.poly:cur.poly}
function mapStep(){
  document.getElementById('qField').innerHTML='<div id="map"></div><div class="mbar"><button id="mUndo" type="button">↶ Undo</button><button id="mClr" type="button">Clear</button><button id="mSat" type="button">🛰 Satellite</button><button id="mLoc" type="button">📍 My location</button><span id="mInfo"></span></div>';
  map=L.map('map');let base=BASE.osm().addTo(map);
  const oth=records.filter(r=>r.poly&&r.id!==editId);
  const g=L.geoJSON(oth.map(r=>({type:'Feature',properties:{t:'W'+r.ward+' B'+r.block},geometry:{type:'Polygon',coordinates:r.poly}})),{style:{color:'#5d6f78',weight:2,fillOpacity:.15,dashArray:'4'},onEachFeature:(f,l)=>l.bindTooltip(f.properties.t,{permanent:true,direction:'center',className:'blk'})}).addTo(map);
  pts=cur.poly?cur.poly[0].slice(0,-1).map(([x,y])=>[y,x]):[];
  if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});else if(oth.length)map.fitBounds(g.getBounds(),{padding:[30,30]});else map.setView([30.9578,76.7914],16);
  map.on('click',e=>{pts.push([e.latlng.lat,e.latlng.lng]);drawPts()});
  document.getElementById('mUndo').onclick=()=>{pts.pop();drawPts()};
  document.getElementById('mClr').onclick=()=>{pts=[];cur.poly=null;drawPts()};
  document.getElementById('mSat').onclick=e=>{map.removeLayer(base);isSat=!isSat;base=(isSat?BASE.sat():BASE.osm()).addTo(map);base.bringToBack();e.target.textContent=isSat?'🗺 Map':'🛰 Satellite'};
  document.getElementById('mLoc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],18),()=>toast('Location nahi mili'));
  drawPts();setTimeout(()=>map&&map.invalidateSize(),60);

function drawPts(){
  if(!map)return;vm.forEach(m=>m.remove());vm=[];
  pts.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:L.divIcon({className:'vtx',iconSize:[22,22]})}).addTo(map);
    m.on('drag',()=>{const q=m.getLatLng();pts[i]=[q.lat,q.lng];drawShape()});
    m.on('contextmenu',()=>{pts.splice(i,1);drawPts()});vm.push(m)});
  drawShape();
}
function drawShape(){
  if(shape)shape.remove();
  shape=(pts.length>=3?L.polygon(pts,{color:'#e5383b',weight:3,fillOpacity:.2}):L.polyline(pts,{color:'#e5383b',weight:3})).addTo(map);
  const i=document.getElementById('mInfo');
  if(i)i.textContent=pts.length>=3?pts.length+' pts · '+Math.round(TURF.area(TURF.polygon([ringOf(pts)]))).toLocaleString()+' m²':pts.length+' pts';
}
function ringOf(p){const r=p.map(([a,b])=>[+b.toFixed(7),+a.toFixed(7)]);r.push(r[0]);return r}
function commitMap(){
  const err=m=>{document.getElementById('err').textContent=m;return false};
  if(!pts.length){cur.poly=null;return true}
  if(pts.length<3)return err('Kam se kam 3 points chahiye – ya Clear dabake skip karo.');
  try{
    const gap=gapM(),mine=TURF.polygon([ringOf(pts)]);let g=mine;
    const bb=r=>{const x=r.map(p=>p[0]),y=r.map(p=>p[1]);return[Math.min(...x),Math.min(...y),Math.max(...x),Math.max(...y)]},m=.002;
    for(const r of records){
      if(r.id===editId||!r.poly)continue;
      const a=bb(g.geometry.coordinates[0]),b=bb(r.poly[0]);
      if(a[0]>b[2]+m||b[0]>a[2]+m||a[1]>b[3]+m||b[1]>a[3]+m)continue;
      const o=TURF.polygon(r.poly),cut=gap>0?TURF.buffer(o,gap,{units:'meters'}):o;
      g=TURF.difference(TURF.featureCollection([g,cut]));
      if(!g)return err('Ye boundary poori tarah dusre block ke andar hai – dubara draw karo.');
    }
    let c=g.geometry.type==='MultiPolygon'?g.geometry.coordinates.map(p=>[p,TURF.area(TURF.polygon(p))]).sort((x,y)=>y[1]-x[1])[0][0]:g.geometry.coordinates;
    c=c.map(r=>r.map(([x,y])=>[+x.toFixed(7),+y.toFixed(7)]));
    const cutA=Math.round(TURF.area(mine)-TURF.area(TURF.polygon(c)));
    cur.poly=c;
    if(cutA>1)toast('Neighbour block se overlap/gap ke liye '+cutA+' m² kaata gaya');
    return true;
  }catch(e){return err('Boundary cross/ulti ho rahi hai – points theek karo ('+e.message+')')}
}
const kx=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kring=r=>r.map(p=>p[0]+','+p[1]+',0').join(' ');
function kmlPlace(r){
  const d=(n,v)=>'<Data name="'+n+'"><value>'+kx(v)+'</value></Data>';
  return '<Placemark><name>'+kx(T(r))+' Ward '+kx(r.ward)+' Block '+kx(r.block)+'</name><description>'+kx(T(r)+' | IV '+r.iv+'\nNorth: '+r.north+'\nEast: '+r.east+'\nSouth: '+r.south+'\nWest: '+r.west)+'</description><styleUrl>#blk</styleUrl><ExtendedData>'+d('Town',T(r))+d('IV',r.iv)+d('Ward',r.ward)+d('Block',r.block)+d('North',r.north)+d('East',r.east)+d('South',r.south)+d('West',r.west)+'</ExtendedData><Polygon><tessellate>1</tessellate><outerBoundaryIs><LinearRing><coordinates>'+kring(r.poly[0])+'</coordinates></LinearRing></outerBoundaryIs>'+r.poly.slice(1).map(h=>'<innerBoundaryIs><LinearRing><coordinates>'+kring(h)+'</coordinates></LinearRing></innerBoundaryIs>').join('')+'</Polygon></Placemark>';

function exportKml(list){
  list=list.filter(r=>r&&r.poly);if(!list.length){toast('Koi boundary draw nahi hui');return}
  const fk=r=>T(r)+' – Ward '+r.ward,fl=[...new Set(list.map(fk))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const body=fl.map(w=>'<Folder><name>'+kx(w)+'</name>'+list.filter(r=>fk(r)===w).sort((a,b)=>+a.block-+b.block).map(kmlPlace).join('')+'</Folder>').join('');
  const kml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>UFS blocks</name><Style id="blk"><LineStyle><color>ff735f0b</color><width>2</width></LineStyle><PolyStyle><color>4d735f0b</color></PolyStyle></Style>'+body+'</Document></kml>';

function parseCsv(t){const rows=[];let row=[],c='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else c+=ch}
  row.push(c);if(row.some(x=>x!==''))rows.push(row);return rows}
function csvToRecs(t){
  const rows=parseCsv(t),h=rows.shift().map(x=>x.trim().toLowerCase().replace(/\s*number$/,''));
  const g=(r,n)=>{const i=h.indexOf(n);return i<0?'':(r[i]||'').trim()};
  return rows.map(r=>{const o={town:g(r,'town')||'Baddi',iv:g(r,'iv'),ward:g(r,'ward'),block:g(r,'block'),north:g(r,'north'),east:g(r,'east'),south:g(r,'south'),west:g(r,'west')};
    const b=g(r,'boundary');
    if(b){const ring=b.split(';').map(x=>x.trim().split(/\s+/).map(Number));
      if(ring.length>=3&&ring.every(p=>p.length===2&&p.every(isFinite))){const a=ring[0],l=ring[ring.length-1];if(a[0]!==l[0]||a[1]!==l[1])ring.push(a);o.poly=[ring]}}
    return o}).filter(o=>o.iv&&o.ward&&o.block)}
function mergeRecs(list){
  const idx=new Map(records.map(r=>[keyOf(r),r])),now=new Date().toISOString();let a=0,u=0;
  list.forEach((r,i)=>{r={...r,town:T(r)};const ex=idx.get(keyOf(r));
    if(ex){const up={...ex};['north','east','south','west'].forEach(k=>{if(r[k])up[k]=r[k]});if(r.poly)up.poly=r.poly;
      if(JSON.stringify(up)!==JSON.stringify(ex)){Object.assign(ex,up,{updated:now});u++}}
    else{const n={...r,id:r.id&&!records.some(x=>x.id===r.id)?r.id:'r'+Date.now()+'_'+i,created:r.created||now,updated:r.updated||now};records.push(n);idx.set(keyOf(n),n);a++}});
  return[a,u]}

/* ---------- events ---------- */
document.getElementById('btnNew').onclick=()=>startEntry();
document.getElementById('btnFile').onclick=linkFile;
document.getElementById('btnCsv').onclick=exportCsv;
document.getElementById('btnKml').onclick=()=>exportKml(records);
const gapEl=document.getElementById('gap');gapEl.value=localStorage.getItem('ufs_gap')??'2';gapEl.onchange=()=>localStorage.setItem('ufs_gap',gapEl.value);
document.getElementById('btnJson').onclick=()=>download('ufs_baddi_blocks.json',payload(),'application/json');
document.getElementById('btnImport').onclick=()=>document.getElementById('importInput').click();
document.getElementById('importInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const t=await f.text();let list;
    if(/\.csv$/i.test(f.name))list=csvToRecs(t);else{const d=JSON.parse(t);if(!Array.isArray(d.records))throw 0;list=d.records}
    if(!list.length)throw 0;
    const [a,u]=mergeRecs(list);await persist();render();toast(a+' new, '+u+' updated')
  }catch(_){alert('File read nahi hui. CSV columns: Town, IV Number, Ward Number, Block Number, North, East, South, West (Boundary optional) – ya app ki JSON file.')}
  e.target.value='';
};
document.getElementById('btnNext').onclick=next;
document.getElementById('btnBack').onclick=back;
document.getElementById('btnCancel').onclick=()=>{if(confirm('Entry cancel karni hai? Bhara hua data save nahi hoga.'))closePop()};
document.getElementById('search').oninput=render;
document.getElementById('list').onclick=async e=>{
  const ed=e.target.dataset.edit,de=e.target.dataset.del,kb=e.target.dataset.kml,bb=e.target.dataset.bnd;
  if(kb)exportKml([records.find(r=>r.id===kb)]);
  if(bb){const r=records.find(x=>x.id===bb);startEntry(r);step=STEPS.findIndex(x=>x.type==='map');showStep()}
  if(ed)startEntry(records.find(r=>r.id===ed));
  if(de&&confirm('Ye block entry delete karni hai?')){records=records.filter(r=>r.id!==de);await persist();render()}
};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&pop.classList.contains('show'))document.getElementById('btnCancel').click()});

loadLocal();render();tryReconnect();fbInit();
