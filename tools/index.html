<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Operations Hub | Tools, Surveys, GIS & Office Utilities</title>
<meta name="description" content="A central workspace for field operations, surveys, GIS tools, office utilities and bills. Search and open the tools you need from one responsive dashboard.">
<meta name="theme-color" content="#0b2545">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    color-scheme:light dark;
    --navy:#0b1d36; --navy2:#173a67; --gold:#d6a34b; --gold-soft:#f7dfae;
    --bg:#f3f6fb; --surface:#fff; --surface2:#f7f9fc; --line:#dfe6f0; --line2:#e9eef5;
    --text:#142238; --muted:#5e6b80; --faint:#8a96a8; --focus:#377dff;
    --shadow:0 2px 8px rgba(15,35,65,.045); --shadow-h:0 18px 42px rgba(15,35,65,.12);
    --r:18px; --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#091321;--surface:#101d30;--surface2:#0c1829;--line:#263750;--line2:#1c2c43;--text:#edf3fc;--muted:#a4b1c5;--faint:#7f8da3;--shadow:0 2px 8px rgba(0,0,0,.2);--shadow-h:0 18px 42px rgba(0,0,0,.32)}
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(214,163,75,.08),transparent 36%),var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:7px}
  a{color:inherit}
  .band{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#09182d 0%,#102b4e 55%,#1c426d 100%);color:#fff;border-bottom:3px solid var(--gold)}
  .band:before,.band:after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
  .band:before{width:420px;height:420px;right:-90px;top:-260px;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 42px rgba(255,255,255,.025),0 0 0 90px rgba(255,255,255,.02)}
  .band:after{width:260px;height:260px;right:20%;bottom:-235px;background:rgba(214,163,75,.12);filter:blur(3px)}
  .band-in{max-width:1240px;margin:0 auto;padding:32px 28px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .id{display:flex;align-items:center;gap:18px;min-width:0}
  .mark{flex:none;width:58px;height:58px;border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;font-weight:850;letter-spacing:1.4px;font-size:16px;color:var(--gold-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .org{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold-soft);font-weight:750;margin-bottom:7px}
  h1{margin:0 0 8px;font-size:clamp(25px,3vw,34px);line-height:1.12;font-weight:760;letter-spacing:-.8px}
  .sub{margin:0;color:#c5d3e7;font-size:13.5px;max-width:620px}
  .clock{text-align:right;color:#c5d3e7;font-size:12px;white-space:nowrap;padding:13px 17px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:15px;backdrop-filter:blur(10px)}
  .clock b{display:block;color:#fff;font-size:25px;font-weight:650;letter-spacing:.4px;font-variant-numeric:tabular-nums}
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 60px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:-24px 0 0;position:relative;z-index:2}
  .stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
  .stat:after{content:"";position:absolute;width:64px;height:64px;right:-26px;bottom:-31px;border-radius:50%;background:rgba(214,163,75,.09)}
  .stat b{font-size:27px;font-weight:760;line-height:1.1;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:12px;font-weight:550}
  .stat.new{border-color:rgba(214,163,75,.7)}
  .toolbar{position:sticky;top:0;z-index:20;margin:18px -8px 0;padding:10px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
  .toolbar-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
  .search{flex:1 1 280px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:11px;background:var(--surface2);border:1px solid var(--line2);color:var(--faint);min-height:44px;transition:border-color .18s,box-shadow .18s}
  .search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px rgba(55,125,255,.1)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:9px 0}
  .search input::placeholder{color:var(--faint)}
  .search kbd{font:600 11px var(--font);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--faint);background:var(--surface)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:650 12px var(--font);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:background .18s,color .18s,border-color .18s,transform .18s}
  .chip:hover{border-color:var(--navy2);color:var(--text);transform:translateY(-1px)}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 9px rgba(11,29,54,.15)}
  .chip i{font-style:normal;font-size:10px;opacity:.72;font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .sec{margin-top:34px;scroll-margin-top:90px}.sec[hidden]{display:none}
  .sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .sec-h h2{margin:0;font-size:16px;letter-spacing:-.2px;display:flex;gap:11px;align-items:center}
  .sec-h .bar{width:4px;height:20px;border-radius:4px;flex:none}
  .sec-h p{margin:0;color:var(--muted);font-size:12px;text-align:right}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:15px}
  .card{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card:before{content:"";position:absolute;z-index:-1;left:0;top:16px;bottom:16px;width:3px;border-radius:0 4px 4px 0;background:var(--c);opacity:.85}
  a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
  a.card:focus-visible{outline-offset:2px}
  .card[hidden]{display:none}
  .card-top{display:flex;gap:13px;align-items:flex-start}
  .tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 20%,var(--line))}
  .card h3{margin:1px 0 0;font-size:15px;line-height:1.3;font-weight:730;letter-spacing:-.15px}
  .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:9.5px;font-weight:750;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:3px 7px}
  .badge-new{font-size:9.5px;font-weight:800;letter-spacing:.4px;background:var(--gold);color:#211603;border-radius:6px;padding:3px 7px}
  .badge-soon{font-size:9.5px;font-weight:750;background:var(--line2);color:var(--muted);border-radius:6px;padding:3px 7px}
  .card p{margin:0;color:var(--muted);font-size:12.8px;line-height:1.65}
  .use{font-size:11.8px;line-height:1.55;padding:10px 11px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
  .use b{color:var(--text);font-weight:700}
  .open{margin-top:auto;padding-top:2px;display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:12px;color:var(--c)}
  .card.soon{opacity:.68;cursor:not-allowed}.card.soon .open{color:var(--faint)}
  .card.feature{grid-column:1/-1;background:linear-gradient(110deg,color-mix(in srgb,var(--c) 8%,var(--surface)),var(--surface) 70%);padding:21px 22px}
  .card.feature h3{font-size:17px}
  .card.feature .tile{width:48px;height:48px}
  .empty{display:none;margin-top:26px;text-align:center;padding:42px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
  footer{margin-top:48px;padding:20px 2px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:11.5px}
  footer b{color:var(--text)}
  @media(max-width:760px){
    .band-in{padding:26px 20px 40px}.wrap{padding:0 20px 44px}
    .clock{padding:10px 13px}.clock b{font-size:21px}
    .toolbar{top:0}
    .sec-h{align-items:flex-start;flex-direction:column;gap:4px}.sec-h p{text-align:left}
    .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
  }
  @media(max-width:520px){
    .band-in{padding:22px 16px 36px}.id{gap:12px}.mark{width:46px;height:46px;border-radius:13px;font-size:14px}
    .org{font-size:9px;letter-spacing:1.3px;margin-bottom:5px}h1{font-size:23px;letter-spacing:-.5px}.sub{font-size:12px}
    .clock{display:none}.wrap{padding:0 14px 38px}
    .stats{gap:7px;margin-top:-19px}.stat{padding:12px 10px;border-radius:13px}.stat b{font-size:22px}.stat span{font-size:10px;line-height:1.35}
    .toolbar{position:static;margin:15px 0 0;padding:0;background:none}.toolbar-in{padding:9px;border-radius:14px;gap:9px}
    .search{flex-basis:100%;min-height:42px}.chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding:1px 1px 5px;scrollbar-width:thin}
    .chip{padding:8px 11px}.grid{grid-template-columns:1fr;gap:11px}.card{padding:16px;border-radius:15px}
    .sec{margin-top:27px}.sec-h{margin-bottom:12px}.card.feature{padding:17px}.card.feature h3{font-size:16px}
    footer{margin-top:36px;flex-direction:column;gap:5px}
  }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  @media print{.toolbar{display:none}.band{background:#fff;color:#111;border-bottom:2px solid #999}.sub,.org,.clock,.clock b{color:#333}.card{box-shadow:none;break-inside:avoid}.wrap{max-width:none;padding:0}.stats{margin-top:10px}}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="id">
    <div class="mark" aria-hidden="true">FO</div>
    <div><div class="org">Personal toolkit</div>
      <h1>Field Operations Hub</h1>
      <p class="sub">PLFS · Urban Frame Survey · Office &amp; Bills · GIS tools</p></div></div>
  <div class="clock" aria-hidden="true"><b id="nowTime">--:--</b><span id="nowDate">&nbsp;</span></div>
</div></header>
<main class="wrap">
  <section class="stats" id="stats" aria-label="Overview"></section>
  <div class="toolbar"><div class="toolbar-in">
    <label class="search"><span id="sIcon" aria-hidden="true"></span>
      <input id="q" type="search" placeholder="Search tools — e.g. GPS, bill, weekly, KML" autocomplete="off" aria-label="Search tools" aria-controls="sections"><kbd>/</kbd></label>
    <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
  </div></div>
  <div class="empty" id="empty">No tools match that search. Try a different word or clear the filter.</div>
  <div id="sections"></div>
  <footer><div><b>Field Operations Hub</b> · 2026</div>
    <div>Tools run in your browser; some sync through Firebase. Press <b>/</b> to search.</div></footer>
</main>
<script src="assets/tools.js"></script>
<script>
(function(){
  var CATS=window.NSO_CATEGORIES,TOOLS=window.NSO_TOOLS,icon=window.NSO_icon;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var state={q:'',cat:'all'};
  var live=TOOLS.filter(function(t){return t.status!=='soon'}).length,nw=TOOLS.filter(function(t){return t.isNew}).length;
  $('#stats').innerHTML='<div class="stat"><b>'+live+'</b><span>Tools available</span></div><div class="stat"><b>'+CATS.length+'</b><span>Work areas</span></div><div class="stat new"><b>'+nw+'</b><span>Newly added</span></div>';
  $('#sIcon').innerHTML=icon('search',18);
  var ch='<button class="chip" data-cat="all" aria-pressed="true">All <i>'+TOOLS.length+'</i></button>';
  CATS.forEach(function(c){var n=TOOLS.filter(function(t){return t.cat===c.id}).length;
    ch+='<button class="chip" data-cat="'+c.id+'" aria-pressed="false"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <i>'+n+'</i></button>'});
  $('#chips').innerHTML=ch;
  function card(t,c){
    var soon=t.status==='soon';
    var inner='<div class="card-top"><div class="tile">'+icon(t.icon,t.featured?24:20)+'</div><div style="min-width:0"><h3>'+esc(t.title)+'</h3><div class="meta"><span class="tag">'+esc(t.type)+'</span>'+(t.isNew?'<span class="badge-new">NEW</span>':'')+(soon?'<span class="badge-soon">NOT IN THIS PACKAGE</span>':'')+'</div></div></div>'+
      '<p>'+esc(t.desc)+'</p><div class="use"><b>Use when:</b> '+esc(t.use)+'</div><div class="open"><span>'+(soon?'Add '+esc(t.file)+' to enable':'Open')+'</span>'+(soon?'':icon('arrow',18))+'</div>';
    var a=' data-cat="'+t.cat+'" data-text="'+esc((t.title+' '+t.type+' '+t.desc+' '+t.keys).toLowerCase())+'" style="--c:'+c.color+'"';
    if(soon)return'<div class="card soon"'+a+' aria-disabled="true">'+inner+'</div>';
    return'<a class="card'+(t.featured?' feature':'')+'" href="'+esc(t.file)+'"'+a+'>'+inner+'</a>';
  }
  var h='';
  CATS.forEach(function(c){
    var items=TOOLS.filter(function(t){return t.cat===c.id}).sort(function(a,b){return(b.featured?1:0)-(a.featured?1:0)});
    h+='<section class="sec" id="sec-'+c.id+'"><div class="sec-h"><h2><span class="bar" style="background:'+c.color+'"></span>'+esc(c.full)+'</h2><p>'+esc(c.blurb)+'</p></div><div class="grid">'+items.map(function(t){return card(t,c)}).join('')+'</div></section>'});
  $('#sections').innerHTML=h;
  function apply(){
    var terms=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean),shown=0;
    document.querySelectorAll('.card').forEach(function(el){
      var ok=(state.cat==='all'||el.dataset.cat===state.cat)&&terms.every(function(w){return el.dataset.text.indexOf(w)>-1});
      el.hidden=!ok;if(ok)shown++});
    document.querySelectorAll('.sec').forEach(function(s){s.hidden=!s.querySelector('.card:not([hidden])')});
    $('#empty').style.display=shown?'none':'block';
  }
  $('#q').addEventListener('input',function(e){state.q=e.target.value;apply()});
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;state.cat=b.dataset.cat;
    document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});apply()});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
    if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';state.q='';apply();$('#q').blur()}});
  var D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
    $('#nowTime').textContent=p(d.getHours())+':'+p(d.getMinutes());
    $('#nowDate').textContent=D[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()}
  tick();setInterval(tick,20000);
})();
</script>
</body>
</html>
