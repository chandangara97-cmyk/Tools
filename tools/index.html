<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Tools · Scheme Hub 2026</title>
<meta name="description" content="Premium GIS property survey workspace and precision KML / Shapefile converters for urban local bodies.">
<meta name="theme-color" content="#0a0f1c">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080f;
    --bg-elev: #0a101c;
    --surface: rgba(14, 21, 36, 0.78);
    --surface-solid: #0e1524;
    --surface2: #0a101c;
    --line: rgba(255,255,255,0.07);
    --line-strong: rgba(255,255,255,0.13);
    --text: #eef2fb;
    --muted: #8b97b0;
    --faint: #5c6a84;
    --gold: #e8b84a;
    --gold-soft: #f7df9a;
    --gold-dim: rgba(232,184,74,0.16);
    --accent: #5b8def;
    --accent-glow: rgba(91,141,239,0.25);
    --rose: #e85d75;
    --violet: #9b7bff;
    --teal: #2dd4bf;
    --shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05) inset;
    --r: 18px;
    --font: 'Outfit', system-ui, -apple-system, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background */
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 90% 55% at 12% -8%, rgba(99,130,255,0.13), transparent 52%),
      radial-gradient(ellipse 70% 45% at 92% 0%, rgba(232,184,74,0.09), transparent 48%),
      radial-gradient(ellipse 55% 35% at 50% 105%, rgba(140,100,255,0.06), transparent 42%);
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent);
  }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  a { color: inherit; text-decoration: none; }

  /* ─── Hero band ─── */
  .hero {
    position: relative; z-index: 1;
    padding: 48px 28px 56px;
    border-bottom: 1px solid var(--line);
  }
  .hero-inner {
    max-width: 1120px; margin: 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 16px;
  }
  .brand-mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.18);
    display: grid; place-items: center;
    font-weight: 800; letter-spacing: 1.2px; font-size: 15px; color: var(--gold-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.3);
  }
  .brand-text .org {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-soft); font-weight: 600; margin-bottom: 4px;
  }
  .brand-text h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.1;
  }
  .brand-text h1 em {
    font-style: italic; color: var(--gold-soft);
  }
  .brand-text .sub {
    margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 420px; font-weight: 400;
  }

  .clock {
    text-align: right;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .clock b {
    display: block; font-size: 26px; font-weight: 600;
    letter-spacing: 0.5px; font-variant-numeric: tabular-nums; color: #fff;
  }
  .clock span { color: var(--muted); font-size: 12px; }

  /* ─── Stats strip ─── */
  .stats {
    position: relative; z-index: 2;
    max-width: 1120px; margin: -28px auto 0; padding: 0 28px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  .stat {
    position: relative; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .stat::after {
    content: ""; position: absolute; width: 72px; height: 72px;
    right: -28px; bottom: -32px; border-radius: 50%;
    background: var(--gold-dim);
  }
  .stat b {
    font-size: 28px; font-weight: 700; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums; display: block; line-height: 1.1;
  }
  .stat span { color: var(--muted); font-size: 12.5px; font-weight: 500; }

  /* ─── Toolbar ─── */
  .toolbar {
    position: sticky; top: 0; z-index: 30;
    max-width: 1120px; margin: 28px auto 0; padding: 0 28px 8px;
    background: linear-gradient(to bottom, var(--bg) 60%, transparent);
  }
  .toolbar-in {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
  }
  .search {
    flex: 1 1 260px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; min-height: 44px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--line);
    color: var(--faint);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search:focus-within {
    border-color: rgba(226,176,74,0.45);
    box-shadow: 0 0 0 3px var(--gold-dim);
  }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0;
    background: transparent; color: var(--text); font: inherit; padding: 10px 0;
  }
  .search input::placeholder { color: var(--faint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--line);
    background: transparent; color: var(--muted);
    font: 500 12.5px var(--font); padding: 8px 14px;
    border-radius: 999px; cursor: pointer;
    transition: all 0.18s;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip[aria-pressed="true"] {
    background: var(--gold-dim);
    border-color: rgba(226,176,74,0.5);
    color: var(--gold-soft);
  }

  /* ─── Sections ─── */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 28px 80px; position: relative; z-index: 1; }
  .sec { margin-top: 40px; }
  .sec-h {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .sec-h h2 {
    font-family: var(--serif);
    font-size: 26px; font-weight: 400; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .sec-h .bar {
    width: 4px; height: 22px; border-radius: 2px; display: inline-block;
  }
  .sec-h p { color: var(--muted); font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  /* ─── Cards — one-of-a-kind ─── */
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 22px 22px 18px;
    box-shadow: var(--shadow), 0 1px 0 rgba(255,255,255,0.04) inset;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), border-color 0.2s, box-shadow 0.25s;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--c, var(--gold)), transparent);
    opacity: 0; transition: opacity 0.25s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-lg);
  }
  .card:hover::before { opacity: 1; }
  .card.feature {
    border-color: rgba(226,176,74,0.35);
    background: linear-gradient(160deg, rgba(226,176,74,0.06), var(--surface) 40%);
  }
  .card.feature::before { opacity: 0.7; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .card.soon { opacity: 0.55; pointer-events: none; }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px;
  }
  .icon-box {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--c, var(--gold)) 18%, transparent);
    color: var(--c, var(--gold));
    border: 1px solid color-mix(in srgb, var(--c, var(--gold)) 28%, transparent);
  }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px;
  }
  .badge.type { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--line); }
  .badge.new { background: rgba(226,176,74,0.2); color: var(--gold-soft); border: 1px solid rgba(226,176,74,0.4); }
  .badge.soon { background: rgba(255,255,255,0.04); color: var(--faint); }

  .card h3 {
    font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.3;
  }
  .card .desc {
    color: var(--muted); font-size: 13.5px; line-height: 1.55; flex: 1; margin-bottom: 14px;
  }
  .card .use {
    font-size: 12.5px; color: var(--faint); padding: 10px 12px;
    background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .card .use b { color: var(--muted); font-weight: 600; }
  .card .open {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600; color: var(--gold-soft);
    padding-top: 4px;
  }
  .card .open svg { transition: transform 0.2s; }
  .card:hover .open svg { transform: translateX(4px); }

  #empty {
    display: none; text-align: center; padding: 60px 20px; color: var(--muted);
  }
  #empty b { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }

  footer {
    position: relative; z-index: 1;
    max-width: 1120px; margin: 0 auto; padding: 0 28px 40px;
    color: var(--faint); font-size: 12.5px; text-align: center;
  }
  footer a { color: var(--muted); border-bottom: 1px solid transparent; }
  footer a:hover { border-color: var(--muted); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: 1fr; }
    .hero { padding: 32px 18px 48px; }
    .hero-inner { flex-direction: column; align-items: flex-start; }
    .clock { align-self: stretch; text-align: left; }
    .toolbar, .wrap, footer { padding-left: 18px; padding-right: 18px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">SH</div>
      <div class="brand-text">
        <div class="org">Scheme Hub 2026</div>
        <h1>Field <em>Tools</em></h1>
        <p class="sub">Precision GIS survey workspace &amp; converters for urban local bodies.</p>
      </div>
    </div>
    <div class="clock" aria-live="polite">
      <b id="nowTime">--:--</b>
      <span id="nowDate">—</span>
    </div>
  </div>
</header>

<div class="stats">
  <div class="stat"><b id="statTools">3</b><span>Active tools</span></div>
  <div class="stat"><b id="statCats">2</b><span>Categories</span></div>
  <div class="stat"><b>AMRUT</b><span>Ready deliverables</span></div>
</div>

<div class="toolbar">
  <div class="toolbar-in">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="q" placeholder="Search tools…  (press /)" autocomplete="off" spellcheck="false">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by category">
      <button class="chip" data-cat="all" aria-pressed="true">All</button>
      <button class="chip" data-cat="property" aria-pressed="false">Property · GIS</button>
      <button class="chip" data-cat="tools" aria-pressed="false">Converters</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="sections"></div>
  <div id="empty"><b>No matching tools</b>Try a different search or category.</div>
</main>

<footer>
  Scheme Hub 2026 · Field tools for municipal survey &amp; GIS workflows
</footer>

<script src="assets/tools.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var CATS=window.NSO_CATEGORIES||[];
  var TOOLS=window.NSO_TOOLS||[];
  var state={q:'',cat:'all'};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function icon(n,s){return window.NSO_icon?window.NSO_icon(n,s):''}

  function card(t,c){
    var soon=t.status==='soon';
    var inner=
      '<div class="card-top">'+
        '<div class="icon-box">'+icon(t.icon,22)+'</div>'+
        '<div class="badge-row">'+
          '<span class="badge type">'+esc(t.type)+'</span>'+
          (t.isNew?'<span class="badge new">New</span>':'')+
          (soon?'<span class="badge soon">Soon</span>':'')+
        '</div>'+
      '</div>'+
      '<h3>'+esc(t.title)+'</h3>'+
      '<p class="desc">'+esc(t.desc)+'</p>'+
      '<div class="use"><b>Use when:</b> '+esc(t.use)+'</div>'+
      '<div class="open"><span>'+(soon?'Coming soon':'Open tool')+'</span>'+(soon?'':icon('arrow',18))+'</div>';
    var a=' data-cat="'+t.cat+'" data-text="'+esc((t.title+' '+t.type+' '+t.desc+' '+t.keys).toLowerCase())+'" style="--c:'+c.color+'"';
    if(soon) return '<div class="card soon"'+a+' aria-disabled="true">'+inner+'</div>';
    return '<a class="card'+(t.featured?' feature':'')+'" href="'+esc(t.file)+'"'+a+'>'+inner+'</a>';
  }

  var h='';
  CATS.forEach(function(c){
    var items=TOOLS.filter(function(t){return t.cat===c.id}).sort(function(a,b){return(b.featured?1:0)-(a.featured?1:0)});
    h+='<section class="sec" id="sec-'+c.id+'">'+
         '<div class="sec-h"><h2><span class="bar" style="background:'+c.color+'"></span>'+esc(c.full)+'</h2>'+
         '<p>'+esc(c.blurb)+'</p></div>'+
         '<div class="grid">'+items.map(function(t){return card(t,c)}).join('')+'</div></section>';
  });
  $('#sections').innerHTML=h;

  function apply(){
    var terms=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean),shown=0;
    document.querySelectorAll('.card').forEach(function(el){
      var ok=(state.cat==='all'||el.dataset.cat===state.cat)&&terms.every(function(w){return el.dataset.text.indexOf(w)>-1});
      el.hidden=!ok; if(ok) shown++;
    });
    document.querySelectorAll('.sec').forEach(function(s){s.hidden=!s.querySelector('.card:not([hidden])')});
    $('#empty').style.display=shown?'none':'block';
  }

  $('#q').addEventListener('input',function(e){state.q=e.target.value;apply()});
  $('#chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    state.cat=b.dataset.cat;
    document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    apply();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
    if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';state.q='';apply();$('#q').blur()}
  });

  var D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick(){
    var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
    $('#nowTime').textContent=p(d.getHours())+':'+p(d.getMinutes());
    $('#nowDate').textContent=D[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
  }
  tick(); setInterval(tick,20000);

  $('#statTools').textContent=TOOLS.filter(function(t){return t.status!=='soon'}).length;
  $('#statCats').textContent=CATS.length;
})();
</script>
</body>
</html>
