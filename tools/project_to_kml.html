<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shapefile → Town-wise KML · Scheme Hub</title>
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/shpjs@3.4.1/dist/shp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#070b14; --surface:rgba(18,26,44,.78); --surface2:#0f1628;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --text:#eef2fb; --muted:#8b97b0; --faint:#5c6a84;
  --gold:#e2b04a; --gold-soft:#f5d98a; --gold-dim:rgba(226,176,74,.15);
  --green:#34d399; --red:#f87171;
  --font:'Outfit',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font); color:var(--text); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  background:
    radial-gradient(ellipse 70% 45% at 15% -5%, rgba(91,141,239,.12), transparent 50%),
    radial-gradient(ellipse 50% 35% at 90% 8%, rgba(155,123,255,.08), transparent 45%),
    var(--bg);
}
.wrap{max-width:1140px;margin:auto;padding:28px 24px 60px}
h1{font-family:var(--serif);font-size:clamp(24px,3.5vw,32px);font-weight:400;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--gold-soft)}
p{margin:8px 0 0;color:var(--muted);font-size:13.5px}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:20px; margin-top:18px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}

label{
  display:block; font-size:12px; font-weight:600; color:var(--muted);
  margin-bottom:6px; letter-spacing:.02em;
}

input,select{
  width:100%; padding:11px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface2); color:var(--text);
  font:inherit; outline:none; transition:border-color .18s, box-shadow .18s;
}
input:focus,select:focus{border-color:rgba(226,176,74,.45);box-shadow:0 0 0 3px var(--gold-dim)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

button{
  padding:12px 18px; border-radius:12px; border:1px solid rgba(226,176,74,.35);
  font-weight:650; font-size:13.5px; cursor:pointer; font-family:var(--font);
  transition:transform .15s, box-shadow .15s;
}
.primary{
  background:linear-gradient(180deg,rgba(226,176,74,.28),rgba(226,176,74,.1));
  color:var(--gold-soft);
}
.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(226,176,74,.2)}
.success{
  background:linear-gradient(180deg,rgba(52,211,153,.3),rgba(52,211,153,.1));
  color:#6ee7b7; border-color:rgba(52,211,153,.4);
}
.success:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(52,211,153,.2)}
.success:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

.console{
  margin-top:14px; background:var(--surface2); border:1px solid var(--line);
  border-radius:14px; padding:14px; height:220px; overflow:auto;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px;
}
.ok{color:var(--green)} .err{color:var(--red)}
.badge{
  display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line); color:var(--muted); font-size:12.5px; font-weight:500;
  background:var(--surface2); margin-top:10px;
}
</style>


<link rel="stylesheet" href="../public/schemehub-light.css">
</head>

<body>
<div class="wrap">

<h1>Shapefile → <em>Town-wise KML</em></h1>
<p>Upload shapefiles directly → export KMLs grouped under town folders</p>


<div class="card">
  <label>Upload Shapefiles (select ALL together)</label>
  <input id="shpFiles" type="file" multiple
    accept=".shp,.shx,.dbf,.prj,.cpg">
  <div class="badge" id="status">Waiting for files…</div>
</div>

<div class="card">
  <div class="grid">
    <div>
      <label>Town field (folder name)</label>
      <select id="townField" disabled></select>
    </div>
    <div>
      <label>b field</label>
      <select id="bField" disabled></select>
    </div>
    <div>
      <label>w field</label>
      <select id="wField" disabled></select>
    </div>
    <div>
      <label>iv field</label>
      <select id="ivField" disabled></select>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="prepareBtn" disabled>Prepare ZIP</button>
    <button class="success" id="downloadBtn" disabled>Download ZIP</button>
  </div>

  <div id="log" class="console"></div>
</div>

</div>

<script>
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const townSel = document.getElementById("townField");
const bSel = document.getElementById("bField");
const wSel = document.getElementById("wField");
const ivSel = document.getElementById("ivField");
const prepareBtn = document.getElementById("prepareBtn");
const downloadBtn = document.getElementById("downloadBtn");

let features = [];
let outBlobUrl = null;

const log = (m,c)=>{
  const d=document.createElement("div");
  d.textContent=m;
  if(c)d.className=c;
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
};

function safeName(v){
  return String(v ?? "UNKNOWN")
    .trim()
    .replace(/[\\/:*?"<>|]/g,"_")
    .replace(/\s+/g,"_");
}

function fillSelect(sel, fields){
  sel.innerHTML="";
  fields.forEach(f=>{
    const o=document.createElement("option");
    o.value=f; o.textContent=f;
    sel.appendChild(o);
  });
}

document.getElementById("shpFiles").addEventListener("change", async e=>{
  logEl.innerHTML="";
  features=[];
  prepareBtn.disabled=true;
  downloadBtn.disabled=true;
  statusEl.textContent="Reading shapefile…";

  try{
    const fileMap={};
    for(const f of e.target.files){
      fileMap[f.name]=await f.arrayBuffer();
    }

    const gj = await shp(fileMap);
    const fc = gj.type==="FeatureCollection" ? gj : gj[Object.keys(gj)[0]];
    features = fc.features;

    const fields = Object.keys(features[0].properties || {});
    fillSelect(townSel,fields);
    fillSelect(bSel,fields);
    fillSelect(wSel,fields);
    fillSelect(ivSel,fields);

    [townSel,bSel,wSel,ivSel].forEach(s=>s.disabled=false);
    prepareBtn.disabled=false;

    statusEl.textContent=`Loaded ${features.length} features`;
    log(`Loaded ${features.length} features`,"ok");
  }catch(err){
    statusEl.textContent="Load failed";
    log("Error: "+err,"err");
  }
});

prepareBtn.onclick = async ()=>{
  log("Building KML ZIP…","ok");
  downloadBtn.disabled=true;

  const zip = new JSZip();
  let count=0;

  for(const f of features){
    const p=f.properties||{};
    const town=safeName(p[townSel.value]);
    const b=p[bSel.value], w=p[wSel.value], iv=p[ivSel.value];
    if(b==null||w==null||iv==null) continue;

    const coords=f.geometry.coordinates[0]
      .map(pt=>`${pt[0]},${pt[1]},0`).join(" ");

    const kml=`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<Placemark>
<name>b${b}_w${w}_iv${iv}</name>
<Polygon>
<outerBoundaryIs><LinearRing>
<coordinates>${coords}</coordinates>
</LinearRing></outerBoundaryIs>
</Polygon>
</Placemark>
</Document>
</kml>`;

    zip.folder(town).file(`b${b}_w${w}_iv${iv}.kml`,kml);
    count++;
  }

  const blob=await zip.generateAsync({type:"blob"});
  outBlobUrl=URL.createObjectURL(blob);
  downloadBtn.disabled=false;

  log(`✅ ${count} KML files created`,"ok");
};

downloadBtn.onclick = ()=>{
  if(!outBlobUrl)return;
  const a=document.createElement("a");
  a.href=outBlobUrl;
  a.download="output_kml_by_town.zip";
  a.click();
};
</script>

<script src="assets/tools.js"></script><script src="assets/hub-nav.js"></script>
</body>
</html>
