name: Update survey releases
on:
  schedule:
    - cron: "30 2 * * *"      # every day, 08:00 IST
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4
      - run: python scripts/update_reports.py
      - name: Commit if changed
        run: |
          git config user.name "reports-bot"
          git config user.email "reports-bot@users.noreply.github.com"
          git add data/reports.json data/reports.js
          git diff --cached --quiet || git commit -m "Update reports $(date -u +%F)" && git push
