name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Add location permissions (GPS tools)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$M"

      - name: Generate launcher icons
        continue-on-error: true
        run: |
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          npx @capacitor/assets generate --android

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename to final.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk final.apk

      - uses: actions/upload-artifact@v4
        with:
          name: final-apk
          path: final.apk
